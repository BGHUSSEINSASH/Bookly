name: bookly

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookly_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bookly}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - bookly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bookly} -d ${POSTGRES_DB:-bookly}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bookly-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - bookly-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: bookly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookly}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bookly_secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - bookly-miniodata:/data

volumes:
  bookly-pgdata:
  bookly-redisdata:
  bookly-miniodata:
